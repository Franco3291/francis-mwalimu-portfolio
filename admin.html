<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | Francis Mwalimu Portfolio</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">
  <div id="admin-app">

    <!-- ==================== LOGIN ==================== -->
    <section id="view-login" class="admin-view">
      <div class="admin-card login-card">
        <div class="login-brand">
          <div class="logo-icon">FM</div>
          <h1>Admin Panel</h1>
          <p>Francis Mwalimu Portfolio</p>
        </div>
        <form id="login-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="login-username">Username</label>
            <input type="text" class="form-control" id="login-username" autocomplete="username" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <input type="password" class="form-control" id="login-password" autocomplete="current-password" required>
          </div>
          <div class="form-error" id="login-error" hidden></div>
          <button type="submit" class="btn btn-primary btn-block" id="login-submit">Sign In</button>
        </form>
      </div>
    </section>

    <!-- ==================== DASHBOARD ==================== -->
    <section id="view-dashboard" class="admin-view hidden">
      <header class="admin-topbar">
        <div class="admin-brand">
          <span class="logo-icon">FM</span>
          <span>Portfolio Admin</span>
        </div>
        <div class="admin-topbar-actions">
          <span class="admin-user" id="admin-user"></span>
          <a class="btn btn-ghost btn-sm" href="index.html" target="_blank" rel="noopener">View Site</a>
          <button class="btn btn-ghost btn-sm" id="btn-logout" type="button">Logout</button>
        </div>
      </header>

      <div class="admin-layout">
        <nav class="admin-sidebar" aria-label="Admin sections">
          <div class="admin-sidebar-label">Content</div>
          <ul id="section-nav"></ul>
          <div class="admin-sidebar-label">Tools</div>
          <ul id="tool-nav">
            <li><button type="button" class="admin-nav-item" data-tool="uploads">Uploads</button></li>
            <li><button type="button" class="admin-nav-item" data-tool="email">Email settings</button></li>
            <li><button type="button" class="admin-nav-item" data-tool="export">Export data.js</button></li>
            <li><button type="button" class="admin-nav-item" data-tool="backup">Download backup</button></li>
            <li><button type="button" class="admin-nav-item admin-nav-danger" data-tool="reset">Reset from data.js</button></li>
            <li><button type="button" class="admin-nav-item" data-tool="password">Change password</button></li>
          </ul>
        </nav>

        <main class="admin-main">
          <div class="admin-editor-head">
            <div>
              <h1 id="editor-title">Choose a section</h1>
              <p id="editor-desc" class="admin-editor-desc"></p>
            </div>
            <div class="admin-save-hint" id="save-hint">Unsaved changes</div>
          </div>

          <div id="editor-body" class="admin-editor-body"></div>

          <div class="admin-actions">
            <button class="btn btn-primary" id="btn-save" type="button">Save Changes</button>
            <button class="btn btn-ghost" id="btn-toggle-json" type="button">Edit as JSON</button>
            <button class="btn btn-ghost" id="btn-discard" type="button">Discard</button>
            <span class="admin-saved-at" id="saved-at"></span>
          </div>
        </main>
      </div>
    </section>
  </div>

  <div id="toast" class="admin-toast hidden" role="status" aria-live="polite"></div>
  <div id="confirm-mask" class="admin-confirm-mask hidden">
    <div class="admin-card admin-confirm">
      <h3 id="confirm-title">Are you sure?</h3>
      <p id="confirm-message"></p>
      <div class="admin-confirm-actions">
        <button class="btn btn-primary" id="confirm-ok" type="button">Yes</button>
        <button class="btn btn-ghost" id="confirm-cancel" type="button">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
